<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real Lucky Spin & Win</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body {
      background-color: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .modal-container {
      background-color: #1c1a17;
      border: 1px solid #d4af37;
      border-radius: 16px;
      padding: 24px;
      width: 90%;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.8);
      position: relative;
      color: #fff;
    }
    .close-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      background: none;
      border: none;
      color: #aaa;
      font-size: 20px;
      cursor: pointer;
    }
    .header-title {
      font-size: 20px;
      font-weight: bold;
      color: #ffd700;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .header-subtitle {
      font-size: 13px;
      color: #ccc;
      margin-bottom: 20px;
    }
    .wheel-container {
      position: relative;
      width: 320px;
      height: 320px;
      margin: 0 auto 20px auto;
    }
    #wheelCanvas {
      width: 320px;
      height: 320px;
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
    }
    .pointer {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 24px solid #ff4d4d;
      z-index: 10;
    }
    .spin-btn {
      background: linear-gradient(180deg, #ff7a29 0%, #e64a19 100%);
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      border: none;
      padding: 12px 36px;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(230, 74, 25, 0.4);
      transition: all 0.3s ease;
    }
    .spin-btn:hover {
      transform: scale(1.05);
    }
    .spin-btn:disabled {
      background: #555;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }
    .result-msg {
      margin-top: 16px;
      font-size: 14px;
      color: #ffd700;
      min-height: 20px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="modal-container">
    <button class="close-btn">&times;</button>
    <div class="header-title">🎡 Real Lucky Spin & Win</div>
    <div class="header-subtitle">Spin the wheel to win instant free items or offers!</div>

    <div class="wheel-container">
      <div class="pointer"></div>
      <canvas id="wheelCanvas" width="600" height="600"></canvas>
    </div>

    <button id="spinBtn" class="spin-btn">SPIN NOW</button>
    <div id="resultMsg" class="result-msg"></div>
  </div>

  <script>
    // Configuration Options
    const items = [
      { label: "Kulhad Chai", lines: ["Kulhad Chai"], color: "#ffffff", textColor: "#d32f2f", iconSrc: "kulhad.png" },
      { label: "Ice Cream", lines: ["Ice Cream"], color: "#ffeb3b", textColor: "#d32f2f", iconSrc: "icecream.png" },
      { label: "Veg Salad", lines: ["Veg Salad"], color: "#ffffff", textColor: "#d32f2f", iconSrc: "salad.png" },
      { label: "Better Luck Next Time", lines: ["Better Luck", "Next Time"], color: "#ffeb3b", textColor: "#d32f2f", iconSrc: "emoji.png" },
      { label: "Kulhad Chai", lines: ["Kulhad Chai"], color: "#ffffff", textColor: "#d32f2f", iconSrc: "kulhad.png" },
      { label: "Ice Cream", lines: ["Ice Cream"], color: "#ffeb3b", textColor: "#d32f2f", iconSrc: "icecream.png" },
      { label: "Veg Salad", lines: ["Veg Salad"], color: "#ffffff", textColor: "#d32f2f", iconSrc: "salad.png" },
      { label: "Better Luck Next Time", lines: ["Better Luck", "Next Time"], color: "#ffeb3b", textColor: "#d32f2f", iconSrc: "emoji.png" }
    ];

    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const spinBtn = document.getElementById('spinBtn');
    const resultMsg = document.getElementById('resultMsg');

    const numSlices = items.length;
    const arc = (2 * Math.PI) / numSlices;
    let startAngle = 0;
    let isSpinning = false;

    // Load PNG Icons
    const loadedImages = {};
    let imagesLoadedCount = 0;

    items.forEach((item, index) => {
      if (item.iconSrc && !loadedImages[item.iconSrc]) {
        const img = new Image();
        img.src = item.iconSrc;
        img.onload = () => {
          imagesLoadedCount++;
          drawWheel();
        };
        loadedImages[item.iconSrc] = img;
      }
    });

    // Draw Wheel Function
    function drawWheel() {
      const radius = canvas.width / 2;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < numSlices; i++) {
        const angle = startAngle + i * arc;
        
        // Draw Slice
        ctx.beginPath();
        ctx.fillStyle = items[i].color;
        ctx.moveTo(radius, radius);
        ctx.arc(radius, radius, radius - 10, angle, angle + arc, false);
        ctx.lineTo(radius, radius);
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = "#ffd700";
        ctx.stroke();

        // Draw Content (Image & Text)
        ctx.save();
        ctx.translate(radius, radius);
        ctx.rotate(angle + arc / 2);

        // Position Icon
        const img = loadedImages[items[i].iconSrc];
        if (img && img.complete) {
          ctx.drawImage(img, radius * 0.55, -20, 40, 40);
        }

        // Position & Format Text
        ctx.fillStyle = items[i].textColor;
        ctx.font = "bold 22px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        const textRadius = radius * 0.35;
        if (items[i].lines.length > 1) {
          ctx.fillText(items[i].lines[0], textRadius, -12);
          ctx.fillText(items[i].lines[1], textRadius, 14);
        } else {
          ctx.fillText(items[i].lines[0], textRadius, 0);
        }

        ctx.restore();
      }

      // Draw Outer Golden Border
      ctx.beginPath();
      ctx.arc(radius, radius, radius - 5, 0, 2 * Math.PI);
      ctx.lineWidth = 10;
      ctx.strokeStyle = "#ffd700";
      ctx.stroke();
    }

    // Check Multiple Spin Status
    function checkSpinStatus() {
      const hasSpun = localStorage.getItem('hasUserSpun');
      const savedResult = localStorage.getItem('spinResultMsg');
      
      if (hasSpun) {
        spinBtn.disabled = true;
        spinBtn.style.display = 'none';
        resultMsg.innerText = savedResult || "Aapne apna spin pehle hi use kar liya hai!";
      }
    }

    // Spin Action Function
    function spin() {
      if (isSpinning || localStorage.getItem('hasUserSpun')) return;

      isSpinning = true;
      spinBtn.disabled = true;

      const spinRounds = 5 + Math.floor(Math.random() * 5);
      const randomSlice = Math.floor(Math.random() * numSlices);
      const targetAngle = (2 * Math.PI * spinRounds) + ((numSlices - randomSlice - 0.5) * arc);
      
      let currentRotation = 0;
      const duration = 4000;
      const startTime = performance.now();

      function animate(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        
        // Ease-out cubic animation
        const easeOut = 1 - Math.pow(1 - progress, 3);
        startAngle = easeOut * targetAngle;

        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          isSpinning = false;
          const winningItem = items[randomSlice];
          
          let winText = "";
          if (winningItem.label === "Better Luck Next Time") {
            winText = "💔 Better Luck Next Time!";
          } else {
            winText = `🎉 You Won: FREE ${winningItem.label}! (Attached to your next WhatsApp order)`;
          }

          resultMsg.innerText = winText;

          // Save state to prevent multiple spins
          localStorage.setItem('hasUserSpun', 'true');
          localStorage.setItem('spinResultMsg', winText);
          spinBtn.style.display = 'none';
        }
      }

      requestAnimationFrame(animate);
    }

    spinBtn.addEventListener('click', spin);

    // Initial Setup
    drawWheel();
    checkSpinStatus();
  </script>
</body>
</html>
