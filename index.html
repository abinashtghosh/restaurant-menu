<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Restaurant Menu</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; color: #333; padding-bottom: 50px; }
    header { background: #d32f2f; color: white; text-align: center; padding: 25px 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    header h1 { font-size: 28px; margin-bottom: 5px; }
    header p { font-size: 14px; opacity: 0.9; }

    .container { max-width: 800px; margin: 20px auto; padding: 0 15px; }

    /* Category Filter Tabs */
    .categories { display: flex; gap: 10px; overflow-x: auto; padding: 10px 0; margin-bottom: 20px; }
    .cat-btn { background: #fff; border: 1px solid #ddd; padding: 8px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; white-space: nowrap; transition: 0.3s; }
    .cat-btn:hover, .cat-btn.active { background: #d32f2f; color: #fff; border-color: #d32f2f; }

    /* Section Headers */
    .section-title { font-size: 22px; margin: 25px 0 15px; border-bottom: 2px solid #d32f2f; display: inline-block; padding-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }

    /* Menu Cards */
    .menu-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
    @media(min-width: 600px) { .menu-grid { grid-template-columns: 1fr 1fr; } }

    .card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: flex; flex-direction: column; justify-content: space-between; position: relative; }
    .card-img { width: 100%; height: 160px; object-fit: cover; background: #eee; }
    .card-body { padding: 15px; flex: 1; }
    
    .badge { position: absolute; top: 10px; right: 10px; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; color: white; text-transform: uppercase; }
    .badge-veg { background-color: #2e7d32; }
    .badge-nonveg { background-color: #c62828; }

    .item-name { font-size: 18px; font-weight: bold; margin-bottom: 5px; }
    .item-desc { font-size: 13px; color: #666; margin-bottom: 12px; height: 36px; overflow: hidden; }
    
    .card-footer { display: flex; justify-content: space-between; align-items: center; padding: 0 15px 15px; }
    .price { font-size: 18px; font-weight: bold; color: #2e7d32; }
    
    .order-btn { background: #25d366; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 5px; text-decoration: none; font-size: 13px; }
    .order-btn:hover { background: #1eb954; }

    .loading { text-align: center; padding: 40px; font-size: 18px; color: #777; }
  </style>
</head>
<body>

  <header>
    <h1>Delicious Restaurant</h1>
    <p>Fresh & Quality Food Delivered</p>
  </header>

  <div class="container">
    <!-- Category Tabs -->
    <div class="categories">
      <button class="cat-btn active" onclick="filterMenu('all')">All Items</button>
      <button class="cat-btn" onclick="filterMenu('veg')">Veg</button>
      <button class="cat-btn" onclick="filterMenu('non-veg')">Non-Veg</button>
      <button class="cat-btn" onclick="filterMenu('dessert')">Desserts</button>
      <button class="cat-btn" onclick="filterMenu('softdrinks')">Soft Drinks</button>
    </div>

    <div id="menu-container">
      <div class="loading">Loading tasty menu...</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD8H2QNMLsu-FrFhFRwf5MXz6KsoRRmXL0",
      authDomain: "menu-74bc7.firebaseapp.com",
      projectId: "menu-74bc7",
      storageBucket: "menu-74bc7.firebasestorage.app",
      messagingSenderId: "419235969075",
      appId: "1:419235969075:web:c4e11d75a7aabbe3b98b46",
      measurementId: "G-QEG8YDF6TN"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allItems = [];
    // Apne WhatsApp number ko yahan replace karein (with country code, e.g. 919876543210)
    const whatsappNumber = "919876543210"; 

    async function loadMenu() {
      try {
        const querySnapshot = await getDocs(collection(db, "menuItems"));
        allItems = [];
        querySnapshot.forEach((doc) => {
          allItems.push({ id: doc.id, ...doc.data() });
        });
        renderMenu(allItems);
      } catch (err) {
        console.error(err);
        document.getElementById('menu-container').innerHTML = '<div class="loading">Error loading menu.</div>';
      }
    }

    function renderMenu(items) {
      const container = document.getElementById('menu-container');
      if (items.length === 0) {
        container.innerHTML = '<div class="loading">No items available in this category.</div>';
        return;
      }

      // Grouping by Category
      const categories = ['veg', 'non-veg', 'dessert', 'softdrinks'];
      let html = '';

      categories.forEach(cat => {
        const catItems = items.filter(i => (i.category || '').toLowerCase() === cat);
        if (catItems.length > 0) {
          html += `<h2 class="section-title">${cat.toUpperCase()}</h2><div class="menu-grid">`;
          catItems.forEach(item => {
            const defaultImg = "https://via.placeholder.com/300x160?text=Food+Item";
            const imgUrl = item.imageUrl || defaultImg;
            const isVeg = item.veg !== undefined ? item.veg : (cat === 'veg');
            
            // Order via WhatsApp message link
            const orderMsg = encodeURIComponent(`Hello, I want to order: ${item.name} (₹${item.price})`);
            const waLink = `https://wa.me/${whatsappNumber}?text=${orderMsg}`;

            html += `
              <div class="card">
                <span class="badge ${isVeg ? 'badge-veg' : 'badge-nonveg'}">${isVeg ? 'Veg' : 'Non-Veg'}</span>
                <img src="${imgUrl}" class="card-img" alt="${item.name}">
                <div class="card-body">
                  <div class="item-name">${item.name}</div>
                  <div class="item-desc">${item.description || ''}</div>
                </div>
                <div class="card-footer">
                  <span class="price">₹${item.price}</span>
                  <a href="${waLink}" target="_blank" class="order-btn">Order Now</a>
                </div>
              </div>
            `;
          });
          html += `</div>`;
        }
      });

      container.innerHTML = html;
    }

    window.filterMenu = function(category) {
      document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      if (category === 'all') {
        renderMenu(allItems);
      } else {
        const filtered = allItems.filter(i => (i.category || '').toLowerCase() === category);
        renderMenu(filtered);
      }
    };

    loadMenu();
  </script>
</body>
</html>
