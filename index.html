<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Royal Heritage Menu & Loyalty</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Segoe UI', Georgia, serif, sans-serif;
      background: linear-gradient(rgba(15, 12, 10, 0.92), rgba(15, 12, 10, 0.95)), 
                  url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=1600&q=80') center/cover fixed;
      color: #f1f1f1;
      padding-bottom: 60px;
      min-height: 100vh;
    }

    header {
      background: rgba(0, 0, 0, 0.85);
      border-bottom: 2px solid #d4af37;
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
    }
    .brand h1 {
      font-size: 26px;
      color: #d4af37;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .brand p {
      font-size: 13px;
      color: #e0d0b0;
      font-style: italic;
    }

    .btn-login {
      background: linear-gradient(135deg, #d4af37, #aa7c11);
      color: #111;
      border: none;
      padding: 10px 20px;
      border-radius: 25px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
      transition: all 0.3s;
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(212, 175, 55, 0.5);
    }

    /* Celebration Banner */
    .banner-container { max-width: 900px; margin: 20px auto 0; padding: 0 15px; }
    .special-banner {
      background: linear-gradient(135deg, #c0392b, #8e44ad);
      color: #ffffff;
      border-radius: 14px;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      gap: 18px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .banner-icon {
      font-size: 36px;
      background: rgba(255, 255, 255, 0.2);
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .banner-text h3 { font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 4px; }
    .banner-text p { font-size: 14px; color: #f8f9fa; opacity: 0.95; }

    .container { max-width: 900px; margin: 25px auto; padding: 0 15px; }

    /* Categories */
    .categories { display: flex; gap: 12px; overflow-x: auto; padding: 10px 0 20px; }
    .cat-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(212, 175, 55, 0.4);
      color: #e0e0e0;
      padding: 9px 22px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.3s ease;
    }
    .cat-btn:hover, .cat-btn.active {
      background: #d4af37;
      color: #111;
      border-color: #d4af37;
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
    }

    /* Menu Section */
    .section-title {
      font-size: 22px;
      margin: 30px 0 18px;
      text-transform: uppercase;
      border-left: 4px solid #d4af37;
      padding-left: 12px;
      color: #d4af37;
      letter-spacing: 1px;
    }
    .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 22px; }

    /* Card Design */
    .card {
      background: rgba(25, 22, 18, 0.85);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(5px);
      transition: transform 0.3s ease;
    }
    .card:hover { transform: translateY(-5px); border-color: rgba(212, 175, 55, 0.6); }
    .card-img-container { width: 100%; height: 180px; background: #2a2a2a; position: relative; }
    .card-img { width: 100%; height: 100%; object-fit: cover; }

    .badge {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      color: white;
      text-transform: uppercase;
    }
    .badge-veg { background-color: #2e7d32; }
    .badge-nonveg { background-color: #c62828; }

    .card-body { padding: 18px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .item-name { font-size: 18px; font-weight: 700; color: #f5e6c8; margin-bottom: 6px; }
    .item-desc { font-size: 13px; color: #b0a898; margin-bottom: 15px; line-height: 1.4; }

    .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
    .price { font-size: 20px; font-weight: 700; color: #d4af37; }

    .order-btn {
      background: #25d366;
      color: white;
      padding: 9px 16px;
      border-radius: 8px;
      font-weight: bold;
      text-decoration: none;
      font-size: 13px;
    }

    /* Modal Styles */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(6px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-card {
      background: #1a1612;
      border: 1px solid #d4af37;
      width: 90%;
      max-width: 440px;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      position: relative;
    }
    .close-btn {
      position: absolute;
      top: 15px; right: 18px;
      color: #d4af37;
      font-size: 22px;
      cursor: pointer;
    }
    .modal-title { font-size: 20px; color: #d4af37; margin-bottom: 15px; text-align: center; font-weight: 700; }
    
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; color: #d4af37; margin-bottom: 5px; }
    .form-control {
      width: 100%;
      padding: 10px 14px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(212,175,55,0.3);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .form-control:focus { border-color: #d4af37; }
    
    .submit-btn {
      width: 100%;
      padding: 12px;
      background: #d4af37;
      color: #111;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .loyalty-card {
      background: linear-gradient(135deg, #2a2015, #15100a);
      border: 1px dashed #d4af37;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
      text-align: center;
    }
    .loyalty-pts { font-size: 32px; font-weight: bold; color: #d4af37; }
    .reward-badge {
      background: #e67e22;
      color: #fff;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      display: inline-block;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>Royal Heritage</h1>
      <p>Fine Dining & Loyalty Club</p>
    </div>
    <button class="btn-login" id="userBtn" onclick="openLoginModal()">Login / Profile</button>
  </header>

  <!-- Celebration Banner -->
  <div class="banner-container" id="banner-container" style="display: none;">
    <div class="special-banner">
      <div class="banner-icon" id="banner-icon">🎉</div>
      <div class="banner-text">
        <h3 id="banner-title">Happy Birthday!</h3>
        <p id="banner-msg">Enjoy a complimentary signature dessert on us today!</p>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="categories">
      <button class="cat-btn active" onclick="filterMenu('all', this)">All Items</button>
      <button class="cat-btn" onclick="filterMenu('veg', this)">Veg</button>
      <button class="cat-btn" onclick="filterMenu('non-veg', this)">Non-Veg</button>
      <button class="cat-btn" onclick="filterMenu('dessert', this)">Desserts</button>
      <button class="cat-btn" onclick="filterMenu('softdrink', this)">Soft Drinks</button>
    </div>

    <div id="menu-container"></div>
  </div>

  <!-- Modal 1: Phone & OTP -->
  <div class="modal-overlay" id="authModal">
    <div class="modal-card">
      <span class="close-btn" onclick="closeModal('authModal')">&times;</span>
      <div id="step-phone">
        <div class="modal-title">Customer Login</div>
        <div class="form-group">
          <label>Mobile Number</label>
          <input type="tel" id="userPhone" class="form-control" placeholder="10-digit mobile number" maxlength="10">
        </div>
        <!-- Recaptcha Container -->
        <div id="recaptcha-container"></div>
        <button class="submit-btn" id="sendOtpBtn" onclick="sendOTP()">Send OTP</button>
      </div>
      <div id="step-otp" style="display: none;">
        <div class="modal-title">Verify OTP</div>
        <p style="font-size:12px; color:#aaa; text-align:center; margin-bottom:10px;">Enter the 6-digit OTP sent to your phone</p>
        <div class="form-group">
          <label>Enter 6-digit OTP</label>
          <input type="text" id="otpInput" class="form-control" placeholder="123456" maxlength="6">
        </div>
        <button class="submit-btn" onclick="verifyOTP()">Verify & Continue</button>
      </div>
    </div>
  </div>

  <!-- Modal 2: Customer Profile & Loyalty -->
  <div class="modal-overlay" id="profileModal">
    <div class="modal-card">
      <span class="close-btn" onclick="closeModal('profileModal')">&times;</span>
      <div class="modal-title">My Loyalty Profile</div>

      <div class="loyalty-card">
        <div style="font-size: 12px; color: #aaa;">Your Loyalty Balance</div>
        <div class="loyalty-pts" id="displayPoints">0 PTS</div>
        <div style="font-size: 11px; color: #e0d0b0; margin-top: 4px;" id="displayVisits">Restaurant Visits: 0</div>
        <div id="rewardBox"></div>
      </div>

      <form id="profileForm" onsubmit="saveProfile(event)">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="custName" class="form-control" required placeholder="Enter your name">
        </div>
        <div class="form-group">
          <label>Date of Birth (DOB)</label>
          <input type="date" id="custDOB" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Marital Status</label>
          <select id="custMarital" class="form-control" onchange="toggleMarriageFields()">
            <option value="Single">Single</option>
            <option value="Married">Married</option>
          </select>
        </div>
        
        <div id="marriedFields" style="display: none;">
          <div class="form-group">
            <label>Anniversary Date</label>
            <input type="date" id="custAnniversary" class="form-control">
          </div>
          <div class="form-group">
            <label>Spouse Date of Birth</label>
            <input type="date" id="custSpouseDOB" class="form-control">
          </div>
        </div>

        <button type="submit" class="submit-btn">Save Profile</button>
      </form>

      <div style="margin-top: 15px; border-top: 1px solid rgba(212,175,55,0.2); padding-top: 10px;">
        <div style="font-size: 11px; color: #aaa; margin-bottom: 5px;">Add Recent Bill (Points Calculation Test)</div>
        <div style="display: flex; gap: 8px;">
          <input type="number" id="billAmount" class="form-control" placeholder="Bill Amount (₹)">
          <button class="submit-btn" style="margin:0; width: 100px;" onclick="addBillPoints()">Add Bill</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase Scripts Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, RecaptchaVerifier, signInWithPhoneNumber } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // Your Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyD8H2QNMLsu-FrFhFRwf5MXz6KsoRRmXL0",
      authDomain: "menu-74bc7.firebaseapp.com",
      projectId: "menu-74bc7",
      storageBucket: "menu-74bc7.firebasestorage.app",
      messagingSenderId: "419235969075",
      appId: "1:419235969075:web:c4e11d75a7aabbe3b98b46",
      measurementId: "G-QEG8YDF6TN"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Initialize Recaptcha
    window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {
      'size': 'invisible'
    });

    // Real Firebase OTP Sender Function
    window.sendFirebaseOTP = function(phone) {
      const fullPhoneNumber = "+91" + phone; // Adding India Country Code (+91)
      const appVerifier = window.recaptchaVerifier;

      signInWithPhoneNumber(auth, fullPhoneNumber, appVerifier)
        .then((confirmationResult) => {
          window.confirmationResult = confirmationResult;
          document.getElementById('step-phone').style.display = 'none';
          document.getElementById('step-otp').style.display = 'block';
          alert("OTP has been sent to " + fullPhoneNumber);
        }).catch((error) => {
          console.error("SMS Error:", error);
          alert("Failed to send OTP: " + error.message);
        });
    };

    // Verify OTP Code
    window.verifyFirebaseOTP = function(otp) {
      if (!window.confirmationResult) {
        alert("Please request OTP first.");
        return;
      }
      window.confirmationResult.confirm(otp).then((result) => {
        const phone = document.getElementById('userPhone').value;
        currentUser = JSON.parse(localStorage.getItem('user_' + phone)) || {
          phone: phone,
          name: '',
          dob: '',
          marital: 'Single',
          anniversary: '',
          spouseDob: '',
          points: 0,
          visits: 0
        };

        closeModal('authModal');
        document.getElementById('userBtn').innerText = currentUser.name ? currentUser.name : 'My Profile';
        openProfileModal();
      }).catch((error) => {
        alert("Invalid OTP code. Please try again.");
      });
    };
  </script>

  <script>
    // Verified High Quality Dish Images
    const menuItems = [
      {
        name: "Butter Chicken",
        category: "Non-Veg",
        price: 369,
        description: "Rich creamy tomato gravy with juicy charcoal-grilled chicken.",
        imageUrl: "https://images.unsplash.com/photo-1603894584373-5ac82b2ae398?w=600&q=80",
        veg: false
      },
      {
        name: "Gulab Jamun",
        category: "Desserts",
        price: 90,
        description: "Soft fried dough balls soaked in rose scented sweet sugar syrup.",
        imageUrl: "https://images.unsplash.com/photo-1626132647523-66f5bf380027?w=600&q=80",
        veg: true
      },
      {
        name: "Paneer Tikka",
        category: "Veg",
        price: 260,
        description: "Marinated cottage cheese cubes grilled to perfection in tandoor.",
        imageUrl: "https://images.unsplash.com/photo-1599487488170-d11ec9c172f0?w=600&q=80",
        veg: true
      },
      {
        name: "Fresh Lime Soda",
        category: "Soft Drinks",
        price: 80,
        description: "Refreshing fizzy drink made with fresh lemon and mint.",
        imageUrl: "https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?w=600&q=80",
        veg: true
      }
    ];

    let currentUser = null;

    function renderMenu(items) {
      const container = document.getElementById('menu-container');
      const grouped = {};

      items.forEach(item => {
        if (!grouped[item.category]) grouped[item.category] = [];
        grouped[item.category].push(item);
      });

      let html = '';
      for (const cat in grouped) {
        html += `<h2 class="section-title">${cat}</h2><div class="menu-grid">`;
        grouped[cat].forEach(item => {
          const waMsg = encodeURIComponent(`Hello! I want to order: ${item.name} (₹${item.price})`);
          html += `
            <div class="card">
              <div class="card-img-container">
                <span class="badge ${item.veg ? 'badge-veg' : 'badge-nonveg'}">${item.veg ? 'Veg' : 'Non-Veg'}</span>
                <img src="${item.imageUrl}" class="card-img" alt="${item.name}">
              </div>
              <div class="card-body">
                <div>
                  <div class="item-name">${item.name}</div>
                  <div class="item-desc">${item.description}</div>
                </div>
                <div class="card-footer">
                  <span class="price">₹${item.price}</span>
                  <a href="https://wa.me/919876543210?text=${waMsg}" target="_blank" class="order-btn">Order Now</a>
                </div>
              </div>
            </div>
          `;
        });
        html += `</div>`;
      }
      container.innerHTML = html;
    }

    function filterMenu(category, btn) {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      if (category === 'all') {
        renderMenu(menuItems);
      } else {
        const filtered = menuItems.filter(i => {
          const cat = i.category.toLowerCase();
          if (category === 'dessert') return cat.includes('dessert');
          if (category === 'softdrink') return cat.includes('drink');
          return cat === category.toLowerCase();
        });
        renderMenu(filtered);
      }
    }

    // Modal Controls
    function openLoginModal() {
      if (currentUser) {
        openProfileModal();
      } else {
        document.getElementById('authModal').style.display = 'flex';
      }
    }
    function openProfileModal() {
      document.getElementById('profileModal').style.display = 'flex';
      loadUserData();
    }
    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    function sendOTP() {
      const phone = document.getElementById('userPhone').value;
      if (phone.length === 10) {
        window.sendFirebaseOTP(phone);
      } else {
        alert('Please enter a valid 10-digit mobile number.');
      }
    }

    function verifyOTP() {
      const otp = document.getElementById('otpInput').value;
      if (otp.length === 6) {
        window.verifyFirebaseOTP(otp);
      } else {
        alert('Please enter a valid 6-digit OTP code.');
      }
    }

    function toggleMarriageFields() {
      const status = document.getElementById('custMarital').value;
      document.getElementById('marriedFields').style.display = (status === 'Married') ? 'block' : 'none';
    }

    function loadUserData() {
      if (!currentUser) return;
      document.getElementById('custName').value = currentUser.name || '';
      document.getElementById('custDOB').value = currentUser.dob || '';
      document.getElementById('custMarital').value = currentUser.marital || 'Single';
      document.getElementById('custAnniversary').value = currentUser.anniversary || '';
      document.getElementById('custSpouseDOB').value = currentUser.spouseDob || '';
      toggleMarriageFields();

      document.getElementById('displayPoints').innerText = `${currentUser.points || 0} PTS`;
      document.getElementById('displayVisits').innerText = `Restaurant Visits: ${currentUser.visits || 0}`;

      const rewardBox = document.getElementById('rewardBox');
      if ((currentUser.points || 0) >= 100) {
        rewardBox.innerHTML = `<span class="reward-badge">🎁 Surprise Gift Unlocked! Show code "ROYAL100" to Manager</span>`;
      } else {
        rewardBox.innerHTML = `<span style="font-size: 11px; color: #888;">Earn ${100 - (currentUser.points || 0)} more points to unlock a free Gift!</span>`;
      }

      checkCelebrations();
    }

    function saveProfile(e) {
      e.preventDefault();
      currentUser.name = document.getElementById('custName').value;
      currentUser.dob = document.getElementById('custDOB').value;
      currentUser.marital = document.getElementById('custMarital').value;
      currentUser.anniversary = document.getElementById('custAnniversary').value;
      currentUser.spouseDob = document.getElementById('custSpouseDOB').value;

      localStorage.setItem('user_' + currentUser.phone, JSON.stringify(currentUser));
      document.getElementById('userBtn').innerText = currentUser.name;
      alert('Profile Saved Successfully!');
      closeModal('profileModal');
      checkCelebrations();
    }

    function addBillPoints() {
      const amount = parseFloat(document.getElementById('billAmount').value);
      if (!amount || amount <= 0) return;

      if (amount >= 1000) {
        const earned = Math.floor(amount / 1000) * 10;
        currentUser.points = (currentUser.points || 0) + earned;
        currentUser.visits = (currentUser.visits || 0) + 1;
        localStorage.setItem('user_' + currentUser.phone, JSON.stringify(currentUser));
        loadUserData();
        alert(`Congratulations! You earned ${earned} Loyalty Points!`);
      } else {
        alert('Bills above ₹1000 earn 10 Loyalty Points per ₹1000.');
      }
      document.getElementById('billAmount').value = '';
    }

    function checkCelebrations() {
      if (!currentUser) return;
      const today = new Date();
      const todayMD = `${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

      let show = false;
      let title = '';
      let icon = '🎉';

      if (currentUser.dob && currentUser.dob.endsWith(todayMD)) {
        show = true;
        title = `Happy Birthday ${currentUser.name}! 🎂`;
        icon = '🎂';
      } else if (currentUser.marital === 'Married' && currentUser.anniversary && currentUser.anniversary.endsWith(todayMD)) {
        show = true;
        title = `Happy Anniversary ${currentUser.name}! 💍`;
        icon = '💍';
      }

      const bannerContainer = document.getElementById('banner-container');
      if (show) {
        bannerContainer.style.display = 'block';
        document.getElementById('banner-icon').innerText = icon;
        document.getElementById('banner-title').innerText = title;
      } else {
        bannerContainer.style.display = 'none';
      }
    }

    renderMenu(menuItems);
  </script>
</body>
</html>
