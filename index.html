<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Royal Heritage - Gourmet Menu & Loyalty</title>
  <style>
    :root {
      --primary-gold: #d4af37;
      --gold-hover: #f3e5ab;
      --bg-dark: #0f0c0a;
      --card-bg: rgba(25, 22, 18, 0.9);
      --text-main: #f1f1f1;
      --text-muted: #b0a898;
      --accent-green: #27ae60;
      --accent-red: #e74c3c;
      --accent-orange: #e67e22;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

    body {
      background: linear-gradient(rgba(15, 12, 10, 0.93), rgba(15, 12, 10, 0.96)), 
                  url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=1600&q=80') center/cover fixed;
      color: var(--text-main);
      padding-bottom: 80px;
      min-height: 100vh;
    }

    /* Header */
    header {
      background: rgba(0, 0, 0, 0.88);
      border-bottom: 2px solid var(--primary-gold);
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }
    .brand h1 { font-size: 24px; color: var(--primary-gold); font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
    .brand p { font-size: 12px; color: var(--text-muted); font-style: italic; }

    .header-actions { display: flex; gap: 10px; }
    .btn-gold {
      background: linear-gradient(135deg, var(--primary-gold), #aa7c11);
      color: #111;
      border: none;
      padding: 9px 18px;
      border-radius: 25px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4); }

    /* Announcement Banner */
    .banner-container { max-width: 950px; margin: 20px auto 0; padding: 0 15px; }
    .special-banner {
      background: linear-gradient(135deg, #c0392b, #8e44ad);
      color: #fff;
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
    }
    .banner-icon { font-size: 30px; background: rgba(255, 255, 255, 0.2); width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

    .container { max-width: 950px; margin: 20px auto; padding: 0 15px; }

    /* Custom Combo Builder Box */
    .combo-builder-box {
      background: linear-gradient(135deg, rgba(40, 30, 20, 0.9), rgba(20, 15, 10, 0.95));
      border: 2px dashed var(--primary-gold);
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 30px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
    }
    .combo-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .combo-header h3 { color: var(--primary-gold); font-size: 20px; }
    .combo-steps { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 18px; }
    @media(max-width: 600px) { .combo-steps { grid-template-columns: 1fr; } }
    
    .combo-select-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
    
    /* Styling select & options for dark theme */
    select {
      width: 100%;
      padding: 10px;
      background-color: #1a1612 !important;
      color: #ffffff !important;
      border: 1px solid rgba(212, 175, 55, 0.4);
      border-radius: 8px;
      outline: none;
      font-size: 13px;
      cursor: pointer;
    }

    select option {
      background-color: #1a1612 !important;
      color: #ffffff !important;
      padding: 10px;
    }

    /* Category Buttons */
    .categories { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 15px; scrollbar-width: none; }
    .cat-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(212, 175, 55, 0.3);
      color: #ddd;
      padding: 8px 18px;
      border-radius: 25px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.3s;
    }
    .cat-btn:hover, .cat-btn.active {
      background: var(--primary-gold);
      color: #111;
      border-color: var(--primary-gold);
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
    }

    /* Menu Cards */
    .section-title { font-size: 20px; margin: 25px 0 15px; text-transform: uppercase; border-left: 4px solid var(--primary-gold); padding-left: 10px; color: var(--primary-gold); letter-spacing: 1px; }
    .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 20px; }

    .card {
      background: var(--card-bg);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s, border-color 0.3s;
    }
    .card:hover { transform: translateY(-4px); border-color: rgba(212, 175, 55, 0.6); }
    .card-img-container { width: 100%; height: 170px; position: relative; background: #222; }
    .card-img { width: 100%; height: 100%; object-fit: cover; }

    .badge-tag { position: absolute; top: 10px; right: 10px; padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; color: white; text-transform: uppercase; }
    .badge-veg { background-color: var(--accent-green); }
    .badge-nonveg { background-color: var(--accent-red); }
    .badge-offer { background-color: var(--accent-orange); }

    .card-body { padding: 15px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .item-name { font-size: 17px; font-weight: 700; color: #f5e6c8; margin-bottom: 4px; }
    .item-desc { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; line-height: 1.4; }

    .custom-options { margin-bottom: 12px; font-size: 12px; display: flex; gap: 8px; flex-wrap: wrap; }

    .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
    .price { font-size: 18px; font-weight: 700; color: var(--primary-gold); }
    .old-price { font-size: 13px; text-decoration: line-through; color: #777; margin-right: 5px; }

    .order-btn {
      background: var(--accent-green);
      color: white;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: bold;
      text-decoration: none;
      font-size: 12px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    /* Modal Overlay & Card */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); backdrop-filter: blur(6px);
      display: none; justify-content: center; align-items: center; z-index: 1000;
    }
    .modal-card {
      background: #1a1612; border: 1px solid var(--primary-gold);
      width: 90%; max-width: 440px; border-radius: 16px; padding: 22px;
      position: relative; max-height: 90vh; overflow-y: auto;
    }
    .close-btn { position: absolute; top: 12px; right: 16px; color: var(--primary-gold); font-size: 22px; cursor: pointer; }
    .modal-title { font-size: 18px; color: var(--primary-gold); margin-bottom: 15px; text-align: center; font-weight: 700; }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; color: var(--primary-gold); margin-bottom: 4px; }
    .form-control {
      width: 100%; padding: 9px 12px; background: rgba(255,255,255,0.07);
      border: 1px solid rgba(212,175,55,0.3); border-radius: 8px; color: #fff; font-size: 13px; outline: none;
    }

    /* Gamification: Spin Wheel Container */
    .wheel-box { text-align: center; margin: 15px 0; }
    .wheel-btn { background: var(--accent-orange); color: white; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; }
  </style>
</head>

  <!-- Modal 1: Login -->

    <div class="modal-card">

      </div>
      <button class="btn-gold" style="width: 100%; margin-top: 10px;" onclick="loginWithMobile()">Continue</button>
    </div>
  </div>

  <!-- Modal 2: Loyalty Profile & Spin Wheel -->
  <div class="modal-overlay" id="profileModal">
    <div class="modal-card">
      <span class="close-btn" onclick="closeModal('profileModal')">&times;</span>
      <div class="modal-title">My Loyalty Dashboard</div>

      <div style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; text-align: center; margin-bottom: 15px; border: 1px solid var(--primary-gold);">
        <div style="font-size: 12px; color: #aaa;">Your Rewards Points</div>
        <div style="font-size: 30px; font-weight: bold; color: var(--primary-gold);" id="displayPoints">50 PTS</div>
      </div>

      <div class="wheel-box">
        <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 8px;">Spin to win instant discount code!</p>
        <button class="wheel-btn" onclick="spinWheel()">🎡 Spin Daily Lucky Wheel</button>
        <div id="wheelResult" style="margin-top: 10px; font-size: 13px; font-weight: bold; color: var(--primary-gold);"></div>
      </div>

      <form id="profileForm" onsubmit="saveProfile(event)">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="custName" class="form-control" required placeholder="Enter name">
        </div>
        <div class="form-group">
          <label>Date of Birth (DOB)</label>
          <input type="date" id="custDOB" class="form-control" required>
        </div>
        <button type="submit" class="btn-gold" style="width: 100%; margin-top: 10px;">Save Profile</button>
      </form>
    </div>
  </div>

    const RESTAURANT_PHONE = "919876543210";

        category: "Drinks & Tea",
        price: 40,
        description: "Refreshing cold carbonated beverage (300ml bottle/can).",
        imageUrl: "https://images.unsplash.com/photo-1622483767028-3f66f32aef97?w=600&q=80",
        veg: true
      },
      {
        id: 17,
        name: "Fresh Lime Soda",
        category: "Drinks & Tea",
        price: 80,
        description: "Chilled fizzy drink prepared with freshly squeezed lemon juice.",
        imageUrl: "https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?w=600&q=80",
        veg: true
      }
    ];

    let currentUser = null;

    function renderMenu(items) {
      const container = document.getElementById('menu-container');
      const grouped = {};

      items.forEach(item => {
        if (!grouped[item.category]) grouped[item.category] = [];
        grouped[item.category].push(item);
      });

      let html = '';
      for (const cat in grouped) {
        html += `<h2 class="section-title">${cat}</h2><div class="menu-grid">`;
        grouped[cat].forEach(item => {
          html += `
            <div class="card">
              <div class="card-img-container">
                <span class="badge-tag ${item.isOffer ? 'badge-offer' : (item.veg ? 'badge-veg' : 'badge-nonveg')}">
                  ${item.isOffer ? 'OFFER' : (item.veg ? 'Veg' : 'Non-Veg')}
                </span>
                <img src="${item.imageUrl}" class="card-img" alt="${item.name}">
              </div>
              <div class="card-body">
                <div>
                  <div class="item-name">${item.name}</div>
                  <div class="item-desc">${item.description}</div>
                  
                  ${item.customizable ? `
                    <div class="custom-options">
                      <select id="spice_${item.id}">
                        <option value="Medium Spicy">🌶️ Medium Spicy</option>
                        <option value="Less Spicy"> Mild</option>
                        <option value="Extra Spicy">🔥🔥 Extra Spicy</option>
                      </select>
                    </div>
                  ` : ''}

                  ${item.hasPortions ? `
                    <div class="custom-options">
                      <select id="portion_${item.id}" onchange="updatePortionPrice(${item.id})">
                        <option value="Half Plate (₹80)">Half Plate - ₹80</option>
                        <option value="Full Plate (₹160)">Full Plate - ₹160</option>
                      </select>
                    </div>
                  ` : ''}
                </div>
                <div class="card-footer">
                  <div>
                    ${item.originalPrice ? `<span class="old-price">₹${item.originalPrice}</span>` : ''}
                    <span class="price" id="price_display_${item.id}">₹${item.price}</span>
                  </div>
                  <button class="order-btn" onclick="directOrder('${item.name}', ${item.price}, ${item.id})">
                    Order WhatsApp
                  </button>
                </div>
              </div>
            </div>
          `;
        });
        html += `</div>`;
      }
      container.innerHTML = html;
    }

    function updatePortionPrice(itemId) {
      const portion = document.getElementById(`portion_${itemId}`).value;
      const priceDisplay = document.getElementById(`price_display_${itemId}`);
      if (portion.includes('160')) {
        priceDisplay.innerText = '₹160';
      } else {
        priceDisplay.innerText = '₹80';
      }
    }

    function filterMenu(category, btn) {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      if (category === 'all') {
        renderMenu(menuItems);
      } else {
        const filtered = menuItems.filter(i => {
          const cat = i.category.toLowerCase();
          if (category === 'offers') return cat.includes('offer');
          if (category === 'snacks') return cat.includes('snack');
          if (category === 'veg') return i.veg && !cat.includes('snack');
          if (category === 'non-veg') return !i.veg;
          if (category === 'dessert') return cat.includes('dessert');
          if (category === 'drinks') return cat.includes('drink');
          return true;
        });
        renderMenu(filtered);
      }
    }

    function directOrder(itemName, price, itemId) {
      let customText = '';
      
      const spiceElem = document.getElementById(`spice_${itemId}`);
      if (spiceElem) {
        customText += ` (Preference: ${spiceElem.value})`;
      }

      const portionElem = document.getElementById(`portion_${itemId}`);
      if (portionElem) {
        customText += ` (${portionElem.value})`;
      }

      const currentPriceText = document.getElementById(`price_display_${itemId}`) ? document.getElementById(`price_display_${itemId}`).innerText : `₹${price}`;

      const message = `Hello! I would like to order:\n- *${itemName}*${customText} @ ${currentPriceText}`;
      window.open(`https://wa.me/${RESTAURANT_PHONE}?text=${encodeURIComponent(message)}`, '_blank');
    }

    function orderCustomCombo() {
      const snack = document.getElementById('comboSnack').value;
      const beverage = document.getElementById('comboBeverage').value;
      const message = `Hello! I want to order Custom Combo Offer (₹119):\n- *Snack:* ${snack}\n- *Beverage:* ${beverage}`;
      window.open(`https://wa.me/${RESTAURANT_PHONE}?text=${encodeURIComponent(message)}`, '_blank');
    }

    function spinWheel() {
      const prizes = ["10% OFF Code: ROYAL10", "Free Lime Soda Code: LIME50", "50 Extra Points", "Try Again Tomorrow!"];
      const prize = prizes[Math.floor(Math.random() * prizes.length)];
      document.getElementById('wheelResult').innerText = `🎉 You Won: ${prize}`;
    }

    function openLoginModal() {
      if (currentUser) {
        document.getElementById('profileModal').style.display = 'flex';
      } else {
        document.getElementById('authModal').style.display = 'flex';
      }
    }

    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function loginWithMobile() {
      const phone = document.getElementById('userPhone').value.trim();
      if (phone.length === 10) {
        currentUser = { phone, name: '', points: 50 };
        closeModal('authModal');
        document.getElementById('profileModal').style.display = 'flex';
      } else {
        alert('Please enter valid 10-digit mobile number');
      }
    }

    function saveProfile(e) {
      e.preventDefault();
      currentUser.name = document.getElementById('custName').value;
      alert('Profile details saved!');
      closeModal('profileModal');
    }

    renderMenu(menuItems);
  </script>
</body>
</html>
